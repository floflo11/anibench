<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;overflow:hidden}canvas{display:block;width:1024px;height:683px}</style></head><body><canvas id="c" width="1024" height="683"></canvas><script type="module">import * as THREE from './vendor/three.module.js';const W=1024,H=683;const canvas=document.getElementById('c');const renderer=new THREE.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.toneMapping=THREE.NoToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(0,W,0,-H,-1,1);camera.position.z=1;let headMesh;let ready=false;function setTime(t){if(!ready)return;t=Math.max(0,Math.min(2,t));let a;if(t===0||t===2)a=0;else a=0.05*Math.sin(Math.PI*t);headMesh.rotation.x=a;renderer.render(scene,camera);}window.setTime=setTime;new THREE.TextureLoader().load('./image.png',(texture)=>{texture.flipY=true;texture.colorSpace=THREE.SRGBColorSpace;texture.needsUpdate=true;const mat=new THREE.MeshBasicMaterial({map:texture});const hx=560,hw=300,hh=300;[[0,0,hx,H],[hx+hw,0,W-hx-hw,H],[hx,hh,hw,H-hh]].forEach(([x,y,w,h])=>{const g=new THREE.PlaneGeometry(w,h);const m=new THREE.Mesh(g,mat);m.position.set(x+w/2,-y-h/2,0);scene.add(m);});const hg=new THREE.PlaneGeometry(hw,hh);hg.translate(0,hh/2,0);headMesh=new THREE.Mesh(hg,mat);const px=hx+hw/2,py=hh;headMesh.position.set(px,-py,0);scene.add(headMesh);setTime(0);ready=true;window.ANIM_READY=true;});</script></body></html>
