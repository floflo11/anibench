<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<script type="module">
import * as THREE from './vendor/three.module.js';

const W = 1200;
const H = 600;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0xffffff, 1);
renderer.domElement.style.width = '1200px';
renderer.domElement.style.height = '600px';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// World coordinates are image coordinates with the Y axis negated.
const camera = new THREE.OrthographicCamera(0, W, 0, -H, 0.1, 100);
camera.position.z = 10;

let loaded = false;
let manual = false;
let animatedGroup;
let handMesh;
let handBaseCoordinates;

const PIVOT_X = 784;
const PIVOT_Y = 258;
const MAX_ANGLE = 18 * Math.PI / 180;

// A loose envelope around the raised hand. The enclosed source pixels include
// the original white background, preserving the hand's antialiased outline.
const handOutline = [
  [768, 258], [798, 258],
  [799, 249], [803, 241],
  [811, 239], [817, 234], [820, 228],
  [818, 222], [814, 219], [809, 220],
  [811, 207], [810, 201], [807, 197],
  [802, 197], [799, 200],
  [799, 196], [795, 193], [790, 193],
  [786, 196], [781, 194], [776, 195],
  [772, 199], [771, 205], [773, 217],
  [769, 221], [764, 219], [758, 219],
  [752, 222], [748, 227], [748, 233],
  [752, 238], [760, 242], [766, 246],
  [770, 252]
];

// This original-image overlay protects the nearby head and ear if the waving
// hand's white source envelope passes over them.
const headProtection = [
  [690, 108], [717, 110], [737, 119], [750, 133],
  [757, 153], [759, 177], [755, 193], [761, 197],
  [764, 204], [762, 215], [756, 223], [749, 225],
  [746, 235], [738, 245], [725, 254], [709, 260],
  [690, 260]
];

function polygonGeometry(points) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], -points[0][1]);
  for (let i = 1; i < points.length; i++) {
    shape.lineTo(points[i][0], -points[i][1]);
  }
  shape.closePath();

  const geometry = new THREE.ShapeGeometry(shape);
  const position = geometry.getAttribute('position');
  const uv = new Float32Array(position.count * 2);

  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const y = -position.getY(i);
    uv[i * 2] = x / W;
    uv[i * 2 + 1] = 1 - y / H;
  }

  geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return geometry;
}

// Subdivide the textured hand so rotation can ease smoothly to zero at the
// wrist instead of producing a gap along a rigid cut.
function deformablePolygonGeometry(points, subdivisionLevels) {
  const source = polygonGeometry(points);
  const position = source.getAttribute('position');
  const index = source.index;
  const triangles = [];

  const getPoint = (i) => [
    position.getX(i),
    -position.getY(i)
  ];

  if (index) {
    for (let i = 0; i < index.count; i += 3) {
      triangles.push([
        getPoint(index.getX(i)),
        getPoint(index.getX(i + 1)),
        getPoint(index.getX(i + 2))
      ]);
    }
  } else {
    for (let i = 0; i < position.count; i += 3) {
      triangles.push([
        getPoint(i),
        getPoint(i + 1),
        getPoint(i + 2)
      ]);
    }
  }

  const imageCoordinates = [];

  function midpoint(a, b) {
    return [(a[0] + b[0]) * 0.5, (a[1] + b[1]) * 0.5];
  }

  function subdivide(a, b, c, level) {
    if (level === 0) {
      imageCoordinates.push(
        a[0], a[1],
        b[0], b[1],
        c[0], c[1]
      );
      return;
    }

    const ab = midpoint(a, b);
    const bc = midpoint(b, c);
    const ca = midpoint(c, a);

    subdivide(a, ab, ca, level - 1);
    subdivide(ab, b, bc, level - 1);
    subdivide(ca, bc, c, level - 1);
    subdivide(ab, bc, ca, level - 1);
  }

  for (const triangle of triangles) {
    subdivide(triangle[0], triangle[1], triangle[2], subdivisionLevels);
  }

  source.dispose();

  const base = new Float32Array(imageCoordinates);
  const vertexCount = base.length / 2;
  const positions = new Float32Array(vertexCount * 3);
  const uvs = new Float32Array(vertexCount * 2);

  for (let i = 0; i < vertexCount; i++) {
    const x = base[i * 2];
    const y = base[i * 2 + 1];

    positions[i * 3] = x;
    positions[i * 3 + 1] = -y;
    positions[i * 3 + 2] = 0;

    uvs[i * 2] = x / W;
    uvs[i * 2 + 1] = 1 - y / H;
  }

  const geometry = new THREE.BufferGeometry();
  const positionAttribute = new THREE.BufferAttribute(positions, 3);
  positionAttribute.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('position', positionAttribute);
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geometry.computeBoundingSphere();

  return { geometry, base };
}

function updateHand(angle) {
  const attribute = handMesh.geometry.getAttribute('position');
  const array = attribute.array;
  const vertexCount = handBaseCoordinates.length / 2;

  for (let i = 0; i < vertexCount; i++) {
    const x = handBaseCoordinates[i * 2];
    const y = handBaseCoordinates[i * 2 + 1];

    // Full rotation through the palm and fingers, smoothly pinned at y=258.
    let weight = (PIVOT_Y - y) / 14;
    weight = Math.max(0, Math.min(1, weight));
    weight = weight * weight * (3 - 2 * weight);

    const localAngle = angle * weight;
    const c = Math.cos(localAngle);
    const s = Math.sin(localAngle);

    const dx = x - PIVOT_X;
    const dy = PIVOT_Y - y;

    const rotatedX = c * dx - s * dy;
    const rotatedY = s * dx + c * dy;

    array[i * 3] = PIVOT_X + rotatedX;
    array[i * 3 + 1] = -(PIVOT_Y - rotatedY);
    array[i * 3 + 2] = 0;
  }

  attribute.needsUpdate = true;
}

function buildScene(texture) {
  const imageMaterial = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.DoubleSide,
    depthTest: false,
    depthWrite: false,
    toneMapped: false
  });

  const base = new THREE.Mesh(
    polygonGeometry([[0, 0], [W, 0], [W, H], [0, H]]),
    imageMaterial
  );
  base.renderOrder = 0;
  scene.add(base);

  animatedGroup = new THREE.Group();
  scene.add(animatedGroup);

  // Remove the original raised hand, revealing only the white backdrop.
  const erasePatch = new THREE.Mesh(
    polygonGeometry(handOutline),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    })
  );
  erasePatch.renderOrder = 1;
  animatedGroup.add(erasePatch);

  const deformable = deformablePolygonGeometry(handOutline, 3);
  handBaseCoordinates = deformable.base;
  handMesh = new THREE.Mesh(deformable.geometry, imageMaterial);
  handMesh.frustumCulled = false;
  handMesh.renderOrder = 2;
  animatedGroup.add(handMesh);

  // Pin everything below the wrist to the untouched source image.
  const lowerImage = new THREE.Mesh(
    polygonGeometry([[0, PIVOT_Y], [W, PIVOT_Y], [W, H], [0, H]]),
    imageMaterial
  );
  lowerImage.renderOrder = 3;
  animatedGroup.add(lowerImage);

  const protectedHead = new THREE.Mesh(
    polygonGeometry(headProtection),
    imageMaterial
  );
  protectedHead.renderOrder = 4;
  animatedGroup.add(protectedHead);

  animatedGroup.visible = false;
}

function renderAt(t) {
  if (!loaded) return false;

  let time = Number(t);
  if (!Number.isFinite(time)) time = 0;
  time = Math.max(0, Math.min(2, time));

  // Make the loop endpoint exactly the same state as time zero.
  const localTime = time === 2 ? 0 : time;

  // Two smooth outward waves. Squaring the sine keeps the motion away from
  // the nearby head and gives zero position and velocity at the loop seam.
  const wave = Math.sin(Math.PI * localTime);
  const angle = -MAX_ANGLE * wave * wave;
  const active = Math.abs(angle) > 1e-9;

  animatedGroup.visible = active;
  if (active) updateHand(angle);

  renderer.render(scene, camera);
  return true;
}

window.ANIM_READY = false;
window.setTime = function(t) {
  // A requested deterministic frame is not overwritten by live playback.
  manual = true;
  return renderAt(t);
};

new THREE.TextureLoader().load('./image.png', (texture) => {
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.flipY = true;
  texture.generateMipmaps = false;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  buildScene(texture);
  loaded = true;

  renderAt(0);
  window.ANIM_READY = true;

  let startStamp = null;
  function playback(stamp) {
    if (manual || !loaded) return;
    if (startStamp === null) startStamp = stamp;
    renderAt(((stamp - startStamp) / 1000) % 2);
    requestAnimationFrame(playback);
  }
  requestAnimationFrame(playback);
});
</script>
</body>
</html>
