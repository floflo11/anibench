<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waving boy — 2s loop</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="1200" height="600" style="width:1200px;height:600px;"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.js';

const W = 1200, H = 600;

// ---- Region definitions (image pixel coords, y down) ----
// Ellipse covering the raised left hand (palm + fingers), plus a wrist/forearm strip
// that overlaps the static forearm so the rotating part stays visually attached.
const ELL = { cx: 240, cy: 158, r: 44 };
const STRIP = { x0: 210, x1: 246, y0: 150, y1: 222 };
const PIVOT_IMG = { x: 228, y: 201 };            // wrist pivot
const FADE_START = 204, FADE_END = 224;          // feather the strip's bottom edge
const AMPL = 0.22;                               // radians (~12.6 deg)

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0xffffff, 1);
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
if ('toneMapping' in renderer) renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, W, H, 0, 0.1, 1000);
camera.position.set(0, 0, 1);

function makeCanvas() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  return c;
}

function buildHandTexture(img) {
  const hand = makeCanvas();
  const hctx = hand.getContext('2d');
  hctx.drawImage(img, 0, 0);

  // mask = hand ellipse + forearm strip
  const mask = makeCanvas();
  const mctx = mask.getContext('2d');
  mctx.fillStyle = '#fff';
  mctx.beginPath();
  mctx.ellipse(ELL.cx, ELL.cy, ELL.r, ELL.r, 0, 0, Math.PI * 2);
  mctx.fill();
  mctx.fillRect(STRIP.x0, STRIP.y0, STRIP.x1 - STRIP.x0, STRIP.y1 - STRIP.y0);

  hctx.globalCompositeOperation = 'destination-in';
  hctx.drawImage(mask, 0, 0);

  // feather the strip's bottom edge so the joint seam fades out
  const fade = makeCanvas();
  const fctx = fade.getContext('2d');
  const g = fctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(Math.max(0, FADE_START / H), 'rgba(255,255,255,1)');
  g.addColorStop(Math.min(1, FADE_END / H), 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  fctx.fillStyle = g;
  fctx.fillRect(0, 0, W, H);
  hctx.globalCompositeOperation = 'destination-in';
  hctx.drawImage(fade, 0, 0);

  return hand;
}

function buildBaseTexture(img) {
  const base = makeCanvas();
  const bctx = base.getContext('2d');
  bctx.drawImage(img, 0, 0);

  // white hole where the hand used to be (ellipse only; forearm stays in the base)
  const hole = makeCanvas();
  const hctx = hole.getContext('2d');
  hctx.fillStyle = '#fff';
  hctx.beginPath();
  hctx.ellipse(ELL.cx, ELL.cy, ELL.r, ELL.r, 0, 0, Math.PI * 2);
  hctx.fill();
  bctx.drawImage(hole, 0, 0);

  return base;
}

function makeTexture(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  return t;
}

// bounding box of the moving hand texture region
const BX = 192, BY = 112, BW = 96, BH = 116;

function buildHandMesh(handTex) {
  const geo = new THREE.PlaneGeometry(BW, BH);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const ix = BX + (x + BW / 2);
    const iy = BY + (BH / 2 - y);
    uv.setXY(i, ix / W, 1 - iy / H);
  }
  uv.needsUpdate = true;

  const mat = new THREE.MeshBasicMaterial({
    map: handTex,
    transparent: true,
    alphaTest: 0.01,
    side: THREE.FrontSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 1;

  const pivot = new THREE.Object3D();
  pivot.position.set(PIVOT_IMG.x, H - PIVOT_IMG.y, 0);
  mesh.position.set((BX + BW / 2) - PIVOT_IMG.x, (H - (BY + BH / 2)) - (H - PIVOT_IMG.y), 0);
  pivot.add(mesh);
  return pivot;
}

let handPivot = null;
window.ANIM_READY = false;

function setTime(t) {
  if (!handPivot) return;
  const tt = ((t % 2) + 2) % 2;           // period = 2 s
  handPivot.rotation.z = AMPL * Math.sin(Math.PI * tt);
  renderer.render(scene, camera);
}
window.setTime = setTime;

const img = new Image();
img.onload = () => {
  const baseTex = makeTexture(buildBaseTexture(img));
  const handTex = makeTexture(buildHandTexture(img));

  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(W, H),
    new THREE.MeshBasicMaterial({ map: baseTex })
  );
  base.position.set(W / 2, H / 2, 0);
  base.renderOrder = 0;
  scene.add(base);

  handPivot = buildHandMesh(handTex);
  scene.add(handPivot);

  renderer.render(scene, camera);
  window.ANIM_READY = true;

  // live playback (setTime itself is fully deterministic)
  const t0 = performance.now();
  (function loop() {
    const t = ((performance.now() - t0) / 1000) % 2;
    setTime(t);
    requestAnimationFrame(loop);
  })();
};
img.src = './image.png';
</script>
</body>
</html>
