<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swinging Pigtails</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #view { display: block; width: 1200px; height: 600px; }
</style>
</head>
<body>
<canvas id="view" width="1200" height="600"></canvas>

<script type="module">
import * as THREE from './vendor/three.js' === undefined ? null : './vendor/three.module.js';
</script>
<script type="module">
import * as THREE from './vendor/three.module.js';

const W = 1200, H = 600, PERIOD = 2;

// ---- renderer: 1200x600 CSS px, DPR 1, orthographic 1px = 1 unit ----
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0xffffff, 1);
renderer.toneMapping = THREE.NoToneMapping;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
else renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, W, H, 0, -100, 100);
camera.position.set(0, 0, 1);
camera.lookAt(0, 0, 0);

function makeTex(cv) {
  const t = new THREE.CanvasTexture(cv);
  if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
  else t.encoding = THREE.sRGBEncoding;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}

// Pigtail regions in image coordinates (y down).
// rect = bounding box of the moving piece; ax,ay = swing pivot (hair tie).
const REGIONS = [
  { x0: 294, y0: 100, w: 70, h: 146, ax: 354, ay: 117, amp: 0.12 }, // left pigtail
  { x0: 466, y0: 94,  w: 56, h: 150, ax: 482, ay: 111, amp: 0.12 }  // right pigtail
];

let pigMeshes = [];

function buildLayers(img) {
  // Base = full image, but pigtails painted out with background white.
  const base = document.createElement('canvas');
  base.width = W; base.height = H;
  const bc = base.getContext('2d', { willReadFrequently: true });
  bc.drawImage(img, 0, 0);
  const bdata = bc.getImageData(0, 0, W, H);

  const crops = [];
  for (const r of REGIONS) {
    const c = document.createElement('canvas');
    c.width = r.w; c.height = r.h;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, r.x0, r.y0, r.w, r.h, 0, 0, r.w, r.h);
    const cd = cx.getImageData(0, 0, r.w, r.h);

    for (let y = 0; y < r.h; y++) {
      for (let x = 0; x < r.w; x++) {
        const i = (y * r.w + x) * 4;
        const R = cd.data[i], G = cd.data[i + 1], B = cd.data[i + 2];
        // keep only the hair/tie: exclude white background, yellow shirt, skin tones
        const isWhite  = Math.min(R, G, B) > 250;
        const isYellow = R > 175 && G > 135 && B < 145;
        const isSkin   = R > 200 && G > 150 && B > 115 && R >= G && G >= B;
        const fg = !isWhite && !isYellow && !isSkin;
        if (fg) {
          const bi = ((r.y0 + y) * W + (r.x0 + x)) * 4;
          bdata.data[bi] = 255; bdata.data[bi + 1] = 255;
          bdata.data[bi + 2] = 255; bdata.data[bi + 3] = 255;
          cd.data[i + 3] = 255;
        } else {
          cd.data[i + 3] = 0;
        }
      }
    }
    cx.putImageData(cd, 0, 0);
    crops.push(c);
  }
  bc.putImageData(bdata, 0, 0);

  const baseMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(W, H),
    new THREE.MeshBasicMaterial({ map: makeTex(base), toneMapped: false })
  );
  baseMesh.position.set(W / 2, H / 2, 0);
  scene.add(baseMesh);

  pigMeshes = [];
  crops.forEach((c, i) => {
    const r = REGIONS[i];
    const geo = new THREE.PlaneGeometry(r.w, r.h);
    // move pivot (hair tie) to local origin
    const ox = r.x0 + r.w / 2 - r.ax;
    const oy = r.ay - r.y0 - r.h / 2;
    geo.translate(ox, oy, 0);
    const mesh = new THREE.Mesh(
      geo,
      new THREE.MeshBasicMaterial({
        map: makeTex(c), transparent: true, depthWrite: false, toneMapped: false
      })
    );
    mesh.position.set(r.ax, H - r.ay, 0.1 + i * 0.05);
    mesh.renderOrder = i + 1;
    scene.add(mesh);
    pigMeshes.push(mesh);
  });
}

window.setTime = function (t) {
  const s = Math.sin((Math.PI * 2 * t) / PERIOD); // period = 2s, s(0)=s(2)=0
  for (let i = 0; i < pigMeshes.length; i++) {
    pigMeshes[i].rotation.z = REGIONS[i].amp * s;
  }
  renderer.render(scene, camera);
};

// ---- load the image, then mark ready ----
const img = new Image();
img.onload = function () {
  buildLayers(img);
  window.setTime(0);
  window.ANIM_READY = true;
};
img.src = './image.png';
</script>
</body>
</html>
